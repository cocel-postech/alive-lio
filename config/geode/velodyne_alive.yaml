common:
    lid_topic:  "/velodyne_points"
    imu_topic:  "/imu/data"
    #    imu_topic:  "/livox/imu"
    time_sync_en: false         # ONLY turn on when external time synchronization is really not possible

preprocess:
    lidar_type: 2                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
    scan_line: 16
    scan_rate: 10
    blind_min: 5.5
    blind_max: 300.0
    point_filter_num: 1

mapping:
    down_sample_size: 0.3
    max_iteration: 4
    voxel_size: 2.0
    max_layer: 4               # 4 layer, 0, 1, 2, 3
    layer_point_size: [ 5, 5, 5, 5, 5 ]
    plannar_threshold: 0.01
    sigma_num: 3.0
    max_points_size: 200
    max_mature_points_size: 200

    fov_degree:    360
    map_range:     -1.0
    extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic,
    extrinsic_T: [ 0.049258, -0.012500, 0.026946 ]
    extrinsic_R: [ 1,0,0,
         0,1,0,
         0,0,1]
         
localizability:
    degeneracy_detection_mode : 0
    en_network : true
    model_name : model_vehicle100
    use_gpu: true
    num_threads: 1
    remove_g: true
    remove_bias: true
    rotation_invariant: true
    buffer_len: 500
    update_mode: 0 # 0: eksf, 1: Degeneracy Direction, 2: Weighted Mean
    net_vel_scale: 0.1 # measurement-noise scale for network velocity update (ESKF mode)
    update_rotation_via_velocity: true
    en_constrained_optimize: true
    optimize_degeneracy_only: true
    publish_estimated_value: true
    


    

noise_model:
    ranging_cov: 0.1
    angle_cov: 0.1
    acc_cov: 0.1
    gyr_cov: 0.01
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001


publish:
    pub_voxel_map: false
    publish_max_voxel_layer: 2         # only publish 0,1,2 layer's plane
    path_en:  true
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: false       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: false  # true: output the point cloud scans in IMU-body-frame
    scan_semantic_publish_en: true # true: output the planar and non-planar point cloud scans in global-frame
    publish_state_value: true
    console_status_en: true           # per-frame terminal dashboard (degeneracy + LIO vs neural velocity)

pcd_save:
    pcd_save_en: false
    interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
